spring:
  application:
    name: lumen-forge-java
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/lumen_forge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    credential-key: ${APP_CREDENTIAL_KEY:}
  storage:
    root: ./data
