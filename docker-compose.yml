services:
  mysql:
    image: mysql:8.0
    container_name: lumen-forge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lumenforge
      MYSQL_DATABASE: lumen_forge
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - lumen-forge-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plumenforge"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  lumen-forge-mysql:
